spring.application.name=api-traffic-analytics-v2
server.port=8083

spring.kafka.streams.application-id=api-traffic-analytics

spring.kafka.streams.properties.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde

spring.kafka.producer.properties.spring.json.type.mapping=\
serviceTrafficAnalytics:com.kafka.api_traffic_analytics.model.ServiceTrafficAnalytics

spring.datasource.url=jdbc:postgresql://localhost:5432/api_traffic
spring.datasource.username=postgres
spring.datasource.password=postgres