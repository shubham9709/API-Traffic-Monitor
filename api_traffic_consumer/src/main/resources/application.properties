server.port=8080
spring.application.name=api-traffic-consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=traffic-monitor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=apiTrafficEvent:com.kafka.api_traffic_consumer.model.ApiTrafficEvent,\
  serviceTrafficAnalytics:com.kafka.api_traffic_consumer.entity.ServiceTrafficAnalytics


spring.datasource.url=jdbc:postgresql://localhost:5432/api_traffic
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true